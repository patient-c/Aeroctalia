# KrystalSVG "BC with extras" — asset de la release de Aeroctalia.
#
# install.sh lo sourcea. Para actualizar el tema:
#   1. rehacer el tarball (ver docs/DISENO-tema-noctalia-krystalsvg.md)
#   2. subirlo como asset de la release v<RICE_VERSION> con el nombre de ASSET
#   3. cambiar SHA256 por el del tarball nuevo
#
# ASSET va en la release v1.0.1 de https://github.com/patient-c/Aeroctalia
ASSET=krystalsvg-bc-extras.tar.zst

SHA256=2f285e8f7ba4d6f90f560f28a64d457ecf8ff29c07b9e79c37737cb4cef92ccd

# Carpeta de primer nivel dentro del tarball, y nombre del tema. Es el
# Name= de index.theme, que es lo que Qt y GTK leen.
DIR=KrystalSVG-Plasma5up-scalable-icontheme-blackysgate.de

# Upstream (blackysgate.de). No lo consulta el instalador: el asset ya viene
# empaquetado en nuestra release. Archivo de origen:
#   2026.08.18-17-22.KrystalSVG-Plasma5up-scalable-icontheme-blackysgate.de.tar.gz
#
# El tarball es el upstream reempaquetado sin modificar (--sort=name, mtime y
# owner fijos para que el sha256 sea reproducible). Los stubs ya vienen
# resueltos en el propio upstream, y el Inherits lo parchea el instalador.
SOURCE_URL=https://www.blackysgate.de