# ~/.config/kitty/kitty.conf
# Tema: Frutiger Aero para Kitty

# --------------------------------------------------
# Fuente
# --------------------------------------------------
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12

# Ligaduras (opcional)
# font_features JetBrainsMonoNL-Regular +liga

# --------------------------------------------------
# Colores base
# --------------------------------------------------
foreground            #E0F7FA
background            #0B1E2D
selection_foreground  #FFFFFF
selection_background  #1E90FF

cursor                #00E5FF
cursor_text_color     #0B1E2D

url_color             #00E5FF

# Bordes de ventana
active_border_color   #00A8E8
inactive_border_color #1A3A4A

# --------------------------------------------------
# Paleta ANSI (0-15)
# --------------------------------------------------
color0  #0B1E2D
color8  #1A3A4A
color1  #FF6B6B
color9  #FF8A8A
color2  #A7E30E
color10 #C2F04A
color3  #FFD166
color11 #FFE08A
color4  #00A8E8
color12 #33C4FF
color5  #B388FF
color13 #D0B3FF
color6  #00E5FF
color14 #66F0FF
color7  #E0F7FA
color15 #FFFFFF

# --------------------------------------------------
# Ventana y transparencia (efecto glassy)
# --------------------------------------------------
window_padding_width       10
background_opacity         0.85
dynamic_background_opacity yes
background_blur            20

# Fondo de pantalla Frutiger Aero (opcional)
# background_image /home/tu_usuario/Imágenes/frutiger_aero.jpg
# background_image_layout scaled
# background_image_linear no

# --------------------------------------------------
# Pestañas (estilo powerline)
# --------------------------------------------------
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_edge            bottom
tab_bar_margin_width    0.0
tab_bar_margin_height   0.0

active_tab_background   #00A8E8
active_tab_foreground   #0B1E2D
inactive_tab_background #0B1E2D
inactive_tab_foreground #E0F7FA
tab_bar_background      #0B1E2D
tab_bar_margin_color    #0B1E2D

# --------------------------------------------------
# Cursor
# --------------------------------------------------
cursor_shape              block
cursor_blink_interval     0.5
cursor_stop_blinking_after 15.0

# --------------------------------------------------
# Scrollback y comportamiento
# --------------------------------------------------
scrollback_lines     10000
mouse_hide_wait      2.0
enable_audio_bell    no
visual_bell_duration 0.1
window_alert_on_bell yes