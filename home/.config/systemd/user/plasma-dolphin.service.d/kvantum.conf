[Service]
# Dolphin se activa por D-Bus (org.freedesktop.FileManager1) cuando el
# navegador u otra app pide "mostrar en carpeta". systemd lo arranca desde
# plasma-dolphin.service: ESE proceso NO pasa por ~/.local/bin/dolphin ni
# por el .desktop, así que hay que inyectar el entorno acá.
#
# QT_STYLE_OVERRIDE → Kvantum (el vidrio).
# QT_QPA_PLATFORMTHEME → qt6ct lee icon_theme=el tema de iconos.
# Sin el segundo, el tema de ventanas está y los iconos no.
Environment=QT_STYLE_OVERRIDE=kvantum
Environment=QT_QPA_PLATFORMTHEME=qt6ct
Environment=QT_QPA_PLATFORM=wayland;xcb
