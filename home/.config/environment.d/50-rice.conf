# Variables de sesión para TODOS los procesos, incluidos los que arranca
# systemd --user (Dolphin desde el navegador, vía org.freedesktop.FileManager1).
#
# ~/.config/hypr/hyprland.lua exporta las mismas QT_*, pero solo las heredan
# los procesos que arranca Hyprland. Sin este archivo, el camino D-Bus se
# queda sin qt6ct → iconos hicolor, sin Kvantum.
#
# systemd-environment-d-generator lo lee en cada login. Hace falta cerrar
# sesión para que aplique. Comprobar:
#   systemctl --user show-environment | grep QT_QPA_PLATFORMTHEME
QT_QPA_PLATFORMTHEME=qt6ct
QT_QPA_PLATFORM=wayland;xcb

# El wrapper de Dolphin vive acá. Sin esto, `dolphin` en una terminal que no
# lea .zshrc pega al binario de /usr/bin y se saltea Kvantum.
PATH=$HOME/.local/bin:$PATH
